[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "dirichlet-gp"
version = "1.0.0"
description = "Dirichlet-based Gaussian-process classification for land-cover data (StatLog, Indian Pines, Pavia University, Salinas, Sentinel-2)"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=7", "pyreadr>=0.5", "h5py>=3"]

[project.scripts]
dirichlet-gp-benchmark = "dirichlet_gp.benchmark:main"
dirichlet-gp-statlog = "dirichlet_gp.statlog_study:main"

[tool.setuptools]
packages = ["dirichlet_gp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
