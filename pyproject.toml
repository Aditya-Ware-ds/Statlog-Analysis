[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "sg-hfq"
version = "0.1.0"
description = "Spectral-Graph-Guided Hierarchical Fuzzy Quantization for selective land-cover classification (StatLog Landsat)"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "pandas>=2.0",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=7", "scikit-fuzzy>=0.4.2", "pyreadr>=0.5"]

[project.scripts]
sg-hfq-experiments = "sg_hfq.experiments:main"

[tool.setuptools]
packages = ["sg_hfq"]

[tool.pytest.ini_options]
testpaths = ["tests"]
